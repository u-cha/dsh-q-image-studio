name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Trusted Publishing requires a GitHub-hosted runner: self-hosted runners
    # cannot obtain the OIDC token npm needs.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            echo "Create the tag as v$VERSION or bump the package version."
            exit 1
          fi

      - name: Verify version is not already published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@u-cha/dsh-q-image-studio@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version $VERSION is already published on npm"
            echo "Bump the version in package.json and create a new tag."
            exit 1
          fi

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@^11.5.1

      - name: Ensure OIDC-only authentication
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Publish
        run: npm publish --access public
